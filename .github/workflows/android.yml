name: Flutter checks and Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate platform wrappers
        run: flutter create --platforms=android,web --org=pk.edu.dhacss --project-name=dhacss_creek_campus_app --no-pub .
      - name: Resolve packages
        run: flutter pub get
      - name: Upload dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile
          path: pubspec.lock
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test --coverage
      - name: Build web admin portal
        run: flutter build web --dart-define-from-file=config/supabase.json
      - name: Upload web portal
        uses: actions/upload-artifact@v4
        with:
          name: school-web-portal
          path: build/web
      - name: Build installable debug APK
        run: flutter build apk --debug --dart-define-from-file=config/supabase.json
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: creek-campus-prototype-android
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/lcov.info

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: school_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify campus and parent data isolation
        env:
          DATABASE_URL: postgres://postgres:local-test-only@localhost:5432/school_test
          ALLOW_DISPOSABLE_DATABASE: '1'
        run: bash backend/test.sh
