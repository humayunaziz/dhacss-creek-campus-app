name: Angular staff portal
on:
  push:
    branches: [main]
    paths: ['admin-web/**', 'backend/**', '.github/workflows/portal.yml']
  pull_request:
    paths: ['admin-web/**', 'backend/**', '.github/workflows/portal.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
        working-directory: admin-web
      - run: npm test
        working-directory: admin-web
      - run: npm run build
        working-directory: admin-web
      - uses: actions/upload-artifact@v4
        with:
          name: angular-portal
          path: admin-web/dist/portal/browser
          if-no-files-found: error
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: portal_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash backend/test.sh
        env:
          DATABASE_URL: postgres://postgres:local-test-only@localhost:5432/portal_test
          ALLOW_DISPOSABLE_DATABASE: '1'
